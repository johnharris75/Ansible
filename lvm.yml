---
- name: lvm
  hosts: all
  become: true
  tasks:
    - name: block
      block:
        - name: ensure vg is defined
          when: ansible_.lvm.vgs.research is not defined
          ansible.builtin.debug:
            msg: "VG NOT DEFINED" 

        - name: create 1000M
          when: ansible_lvm.vgs.research is defined
          community.general.lvol:
            vg: research
            lv: data
            size: 1000M

      rescue:
        - name: ensure vg is defined
          when: ansible_lvm.vgsresearch is  defined
          ansible.builtin.debug:
            msg: "VG NOT LARGE ENOUGH"

        - name: create 600M
          when: ansible_lvm.vgs.research is defined
          community.general.lvol:
            vg: research
            lv: data
            size: 600M

      always:
        - name: create filesystem
          when: ansible_lvm.vgs.research is defined
          community.general.filesystem:
            dev: /dev/research/data
            fstype: ext4



[defaults]
roles_path = /home/devops/ansible/roles:/usr/share/ansible/roles/rhel-system-roles.timesync/:/usr/share/ansible/roles
collections_path= /home/devops/ansible/collections:/home/devops/ansible/collections/ansible_collections/
inventory= /home/devops/ansible/inventory
remote_user= devops

[privilege_escalation]
ask_pass=False
become_ask_pass=False
become_method=sudo
become_user=root
become: true


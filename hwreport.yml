---
- name: hwreport
  hosts: all
  become: true
  tasks:
    - name: download url
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/RedHatRanger/RHCE9Vagrant/main/rhce-practice-questions/golden_files/hwreport.txt
        dest: /root/hwreport.txt

    - name: configure report
      ansible.builtin.replace:
        path: /root/hwreport.txt
        regexp: "{{ item.old }}"
        replace: "{{ item.new }}"
      loop:
        - old: "inventoryhostname"
          new: "{{ ansible_hostname | default ('NONE') }}"
        - old: "memory_in_MB"
          new: "{{ ansible_memtotal_mb | default ('NONE') }}"
        - old: "BIOS_version"
          new: "{{ ansible_bios_version | default ('NONE') }}"
        - old: "disk_sda_size"
          new: "{{ ansible_devices.sda.size | default  ('NONE') }}"
        - old: "disk_sdb_size"
          new: "{{ ansible_devices.sdb.size | default ('NONE') }}"


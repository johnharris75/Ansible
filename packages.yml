---
- name: packages
  hosts: all
  become: true
  tasks:
    - name: install software on dev and test
      when: inventory_hostname in groups['dev'] or inventory_hostname in groups['test']
      ansible.builtin.dnf:
        name:
          - php
          - mariadb
        state: present

    - name: install dev tools
      when: inventory_hostname in groups['dev']
      ansible.builtin.dnf:
        name: '@RPM Development Tools'
        state: present

    - name: update all
      ansible.builtin.dnf:
        name: "*"
        state: latest


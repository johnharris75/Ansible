---
- name: packages
  hosts: dev balancers prod
  become: true
  tasks:
    - name: install php and mariadb
      ansible.builtin.dnf:
        name:
          - php
          - mariadb
        state: present

    - name: install dev tools on dev
      when: inventory_hostname in groups['dev']
      ansible.builtin.dnf:
        name: '@RPM Development Tools'
        state: present

    - name: install updgrades
      when: inventory_hostname in groups['dev']
      ansible.builtin.dnf:
        name: '*'
        state: latest 

---
- name: install php and mariadb on dev
  hosts: prod dev test
  become: true
  tasks:
    - name: install packages
      ansible.builtin.dnf:
        name:
          - php
          - mariadb
        state: present

- name: install dev tools on dev
  hosts: dev
  become: true
  tasks:
    - name: dev tools
      ansible.builtin.dnf:
        name: '@RPM Development Tools'
        state: present

- name: update all packages
  hosts: dev
  become: true
  tasks:
    - name: update
      ansible.builtin.dnf:
        name: "*"
        state: latest


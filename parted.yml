---
- name: part
  hosts: all
  become: true
  tasks:
    - name: block
      block:
        - name: ensure disk is defined
          when: ansible_devices.sdb not defined
          ansible.builtin.debug:
            msg: "part not defined"

        - name: create part
          when: ansible_devices.sdb is defined
          community.general.parted:
            device: /dev/sdb
            number: 1
            fs_type: ext4
            part_end: 1200MiB

      rescue:
        - name: ensure disk has enough space
          when: ansible_devices.sdb is defined
          ansible.builtin.debug:
            msg: "part not large enough"

        - name: create part
          when: ansible_devices.sdb is defined
          community.general.parted:
            device: /dev/sdb
            number: 1
            fs_type: ext4
            part_end: 800MiB


      always:
        - name: create fs
          when: ansible_devices.sdb is defined
          community.general.filesystem:
            dev: /dev/sdb
            fstype: ext4

        - name: mount if on prod
          when: inventory_hostname in groups['prod']
          ansible.posix.mount:
            path: /srv
            src: /desv/sdb1
            fstype: ext4
            state: mounted

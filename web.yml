
---
- name: webdev
  hosts: dev
  become: true
  tasks:
    - name: ensure group
      ansible.builtin.group:
        name: apache
        state: present

    - name: create /webdev
      ansible.builtin.file:
        dest: /webdev
        state: directory
        group: apache
        mode: '2755'
        setype: httpd_sys_content_t

    - name: create sym link
      ansible.builtin.file:
        src: /webdev
        dest: /var/www/html/webdev
        state: link
        force: true
        setype: httpd_sys_content_t

    - name: index file
      ansible.builtin.copy:
        content: Development
        dest: /webdev/index.html
        setype: httpd_sys_content_t



---
- name: install packages
  ansible.builtin.dnf:
    name:
      - httpd
      - firewalld
    state: present

- name: start and enable firewall
  ansible.builtin.service:
    name: firewalld
    state: started
    enabled: true

- name: host the web page template
  ansible.builtin.template:
    src: index.html.j2
    dest: /var/www/html/index.html

- name: allow http traffice
  ansible.posix.firewalld:
    service: http
    permanent: true
    state: enabled
    immediate: true

- name: start and enabled httpd
  ansible.builtin.service:
    name: httpd
    state: started
    enabled: true



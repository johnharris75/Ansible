---
- name: cron as nat
  hosts: all
  become: true
  tasks:
    - name: create user
      ansible.builtin.user:
        name: nat
        shell: /bin/bash

    - name: cron
      ansible.builtin.cron:
        name: cron as nat
        job: 'logger "EX294 in progresss"'
        minute: "*/2"
        user: nat

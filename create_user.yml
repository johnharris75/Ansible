---
- name: create user based on job descriptopm
  hosts: dev test
  become: true
  vars_files:
    - vault.yml
    - user_list.yml
  tasks:
    - name: ensure devops1
      ansible.builtin.group:
        name: devops1
        state: present

    - name: create user add to supplimentart grtoup and password
      loop: "{{ users }}"
      ansible.builtin.user:
        name:  "{{ item.name }}"
        shell: /bin/bash
        uid: "{{ item.uid }}"
        group: devops1
        append: true
        password: "{{ 'dev_pass' | password_hash('sha512') }}" 

- name: create user based on job descriptopm
  hosts: prod 
  become: true
  vars_files:
    - vault.yml
    - user_list.yml
  tasks:
    - name: ensure devops1
      ansible.builtin.group:
        name: opsmgr1
        state: present

    - name: create user add to supplimentart grtoup and password
      loop: "{{ users }}"
      ansible.builtin.user:
        name:  "{{ item.name }}"
        shell: /bin/bash
        uid: "{{ item.uid }}"
        group: opsmgr1
        append: true
        password: "{{ 'mgr_pass' | password_hash('sha512') }}" 

